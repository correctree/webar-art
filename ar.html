<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ARARART — マーカー体験</title><link rel="stylesheet" href="./studio/style.css"><script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script></head><body><div id="stage" class="ar-stage"></div><div id="space-aim" hidden role="group" aria-label="空間配置"><span aria-hidden="true">＋</span><small id="space-aim-label">配置場所を探しています</small><progress id="space-aim-progress" max="100" value="0" aria-label="配置候補の安定確認"></progress><button id="space-aim-place" class="primary" type="button" disabled>安定を待っています</button></div><div id="capture-controls" hidden><button id="capture-button" type="button" aria-pressed="false">● 動画を撮影</button><button id="capture-stop" type="button" hidden>■ 停止して保存へ</button><small id="capture-note" aria-live="polite">無音・最長30秒</small><button id="capture-diagnostic" type="button" hidden>録画診断を保存</button></div><section id="capture-result" hidden role="region" aria-label="録画の確認と保存"><h2>録画の確認</h2><video id="capture-preview" controls playsinline muted></video><p>この録画は無音です。</p><button id="capture-share" type="button">共有・写真へ保存</button><a id="capture-download" class="button" download>ダウンロード</a><button id="capture-close" type="button">ARに戻る</button><p id="capture-save-note"></p></section><section id="ar-controls" class="ar-ui"><small>ARARART</small> <strong id="title">ARARART</strong> <small>PLAYER 0.16.0</small><small id="tracking" aria-live="polite"></small><p id="status" role="status">作品を読み込んでいます。</p><p id="error"></p><button id="start" class="primary" disabled>ARを開始</button><button id="resume" hidden>動画を再生</button><button id="stop" hidden>終了</button><button id="mute">音 ON</button><span id="scene-label"></span><div id="space-controls" hidden><button id="space-place" class="primary" disabled>作品群をここに置く</button><button id="space-reset" disabled>置き直す</button><details><summary>作品群の大きさ：<output id="space-size-label">100%</output></summary><button id="space-smaller">小さく</button><button id="space-larger">大きく</button><button id="space-size-reset">100%に戻す</button><p>作品群全体の倍率です。この体験中だけ適用されます。</p></details><details><summary>空間配置の確認</summary><button id="space-freeze">動きを一時停止して確認</button><button id="space-diagnostic">空間配置の診断を保存</button><p>特徴点への配置です。平面検出・実寸・終了後の位置復元は未対応です。</p></details></div><details><summary>シーン・マーカー</summary><select id="scenes" aria-label="シーン選択"></select><button id="audio-test" hidden>音声をテスト</button><button id="test-reaction">作品の反応を確認</button><div id="markers"></div></details></section><style>
#capture-controls{position:fixed;z-index:7;left:12px;top:max(12px,env(safe-area-inset-top));max-width:60vw}#capture-controls small{display:block;max-width:230px;background:#112126df;padding:4px;border-radius:6px;font-size:11px}#capture-button{min-height:44px;background:#112126ef;color:#fff}#capture-stop{display:block;min-height:52px;min-width:170px;background:#b62438;color:white;pointer-events:auto;touch-action:manipulation;margin-top:5px}#capture-button[aria-pressed="true"]{background:#b62438}#capture-result{position:fixed;z-index:10;inset:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));padding:16px;background:#112126fa;border-radius:14px;overflow:auto}#capture-result video{display:block;width:100%;max-height:55dvh;background:#000}#capture-result button,#capture-result a{margin:6px 4px 0 0;min-height:44px}
#stage canvas.space-camera{position:absolute!important;left:0!important;top:0!important;width:100%!important;height:100%!important}
#space-aim{position:fixed;left:50%;width:min(260px,calc(100vw - 32px));box-sizing:border-box;z-index:4;transform:translate(-50%,-28px);text-align:center;color:#ffcd72;pointer-events:none;text-shadow:0 1px 4px #000}
#space-aim span{display:block;width:56px;height:56px;margin:auto;border:3px solid currentColor;border-radius:50%;background:#10202366;font-size:36px;line-height:48px}
#space-aim small{display:block;margin-top:8px;min-width:0;box-sizing:border-box;overflow-wrap:anywhere;padding:7px;border-radius:8px;background:#102023dd;color:inherit;font-size:13px}
#space-aim progress{display:block;width:100%;height:8px;margin:6px 0;accent-color:#ffcd72}
#space-aim button{pointer-events:auto;min-height:44px;width:100%;touch-action:manipulation;text-shadow:none}
#space-aim.ready progress{accent-color:#a4efc9}
#space-aim.ready{color:#a4efc9}
body.space-player .ar-ui{max-height:35dvh;overflow:auto;padding:12px;bottom:max(12px,env(safe-area-inset-bottom))}
body.space-player .ar-ui p{margin:6px 0}body.space-player .ar-ui button{min-height:44px;padding:9px 12px;margin-top:4px}

#ar-ui-toggle{position:fixed;z-index:6;top:max(12px,env(safe-area-inset-top));right:12px;min-height:44px;background:#112126df;color:#e7eeed;touch-action:manipulation}
</style>
<button id="ar-ui-toggle" type="button" aria-controls="ar-controls" aria-expanded="true">操作を隠す</button>
<script>
(()=>{
 const panel=document.getElementById('ar-controls');
 const toggle=document.getElementById('ar-ui-toggle');
 toggle.addEventListener('click',event=>{
  event.stopPropagation();
  panel.hidden=!panel.hidden;
  toggle.setAttribute('aria-expanded',String(!panel.hidden));
  toggle.textContent=panel.hidden?'操作を表示':'操作を隠す';
 });
})();
</script>
<script type="module" src="./studio/player.js"></script></body></html>
